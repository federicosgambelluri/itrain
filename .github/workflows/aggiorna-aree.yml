name: Aggiorna le zone

# I dati di ogni zona -- passaggi a livello, stazioni, tratte e orario dei
# treni -- si rigenerano ogni notte.
#
# Le zone si costruiscono una regione per job, in parallelo. In sequenza non
# ci stavano: ventinove zone di fila hanno superato le cinque ore e la prima
# esecuzione e' stata annullata a meta'.
#
# Ogni job produce solo i file delle proprie zone; un job finale li rimette
# insieme, rigenera l'indice e committa una volta sola. Committare da piu' job
# in parallelo produrrebbe conflitti sullo stesso ramo.

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC. Il cron di GitHub parte in ritardo,
                             # anche di ore: per questo lo script sceglie da se'
                             # se scansionare oggi o domani, in base all'ora.
  workflow_dispatch:
    inputs:
      zona:
        description: "Una zona o piu' (slug separati da spazio), vuoto per tutte"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: aggiorna-zone
  cancel-in-progress: false

jobs:
  elenca:
    runs-on: ubuntu-latest
    outputs:
      regioni: ${{ steps.calcola.outputs.regioni }}
    steps:
      - uses: actions/checkout@v4
      - id: calcola
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          aree = json.load(open("tools/aree.json"))
          scelte = os.environ.get("ZONA", "").split()
          if scelte:
              aree = [a for a in aree if a["slug"] in scelte]
          regioni = sorted({a["region"] for a in aree})
          print("regioni=" + json.dumps(regioni))
          PY
        env:
          ZONA: ${{ github.event.inputs.zona }}

  zone:
    needs: elenca
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false          # una regione che fallisce non ferma le altre
      max-parallel: 3           # Overpass respinge le richieste troppo ravvicinate
      matrix:
        regione: ${{ fromJson(needs.elenca.outputs.regioni) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # I binari cambiano molto piu' lentamente degli orari: riscaricarli ogni
      # notte per tutte le zone significherebbe decine di interrogazioni pesanti
      # a Overpass, che limita le richieste ravvicinate.
      - name: Recupera la copia locale di binari e nodi
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: osm-${{ matrix.regione }}-${{ hashFiles('tools/aree.json') }}-${{ github.run_id }}
          restore-keys: |
            osm-${{ matrix.regione }}-${{ hashFiles('tools/aree.json') }}-
            osm-${{ matrix.regione }}-

      - name: Rigenera le zone di ${{ matrix.regione }}
        run: |
          zone=$(python3 - <<'PY'
          import json, os
          aree = json.load(open("tools/aree.json"))
          scelte = os.environ.get("ZONA", "").split()
          print(" ".join(a["slug"] for a in aree
                         if a["region"] == os.environ["REGIONE"]
                         and (not scelte or a["slug"] in scelte)))
          PY
          )
          echo "zone: $zone"
          echo "SLUG_ZONE=$zone" >> "$GITHUB_ENV"
          for z in $zone; do
            echo "::group::$z"
            # Una zona che fallisce non deve impedire alle altre di aggiornarsi.
            python3 tools/build_area.py "$z" --cache-ways \
              || echo "zona $z non riuscita, proseguo"
            echo "::endgroup::"
            sleep 20
          done
        env:
          REGIONE: ${{ matrix.regione }}
          ZONA: ${{ github.event.inputs.zona }}

      # Si caricano solo i file costruiti da questo job.
      #
      # Caricando tutta la cartella, ogni job spediva anche le zone delle altre
      # regioni gia' presenti nel repository: al momento di rimetterli insieme
      # gli stessi nomi arrivavano da venti artefatti diversi, e un file usciva
      # con due JSON attaccati. Il job di unione moriva su "Extra data" e per
      # due notti di fila non e' stato committato nulla.
      - name: Metti da parte solo le zone di questa regione
        run: |
          mkdir -p /tmp/prodotte
          for z in $SLUG_ZONE; do
            [ -f "data/aree/$z.json" ] && cp "data/aree/$z.json" /tmp/prodotte/
          done
          ls -la /tmp/prodotte/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: zone-${{ matrix.regione }}
          path: /tmp/prodotte/*.json
          retention-days: 1
          if-no-files-found: warn

  unisci:
    needs: zone
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/zone
          merge-multiple: true

      - name: Rimetti insieme le zone prodotte
        run: |
          if ! ls /tmp/zone/*.json >/dev/null 2>&1; then
            echo "nessuna zona prodotta: non c'e' niente da unire"
            exit 1
          fi
          echo "$(ls /tmp/zone/*.json | wc -l) file ricevuti dai job"
          # Un file illeggibile va scartato, non deve far cadere l'unione:
          # le altre zone sono buone e vanno committate lo stesso.
          for f in /tmp/zone/*.json; do
            if python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f" 2>/dev/null; then
              cp "$f" data/aree/
            else
              echo "scartato perche' illeggibile: $(basename "$f")"
            fi
          done

      - name: Scarta le zone peggiorate e tieni le buone
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          def committata(percorso):
              """Il file com'era prima di questa esecuzione."""
              r = subprocess.run(["git", "show", f"HEAD:{percorso}"],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  return None
              try:
                  return json.loads(r.stdout)
              except json.JSONDecodeError:
                  return None

          # Una zona peggiorata viene riportata alla versione precedente, non
          # fatta fallire tutta l'esecuzione. Bloccare l'intero commit per una
          # provincia andata male -- come e' successo con Campobasso, passato
          # da otto treni a zero -- avrebbe tenuto ferme anche tutte le altre,
          # che erano buone.
          respinte, rotte = [], []
          for fn in sorted(os.listdir("data/aree")):
              if not fn.endswith(".json"):
                  continue
              percorso = f"data/aree/{fn}"
              try:
                  nuovo = json.load(open(percorso))
              except json.JSONDecodeError:
                  rotte.append(fn)
                  continue
              vecchio = committata(percorso)
              if not vecchio:
                  continue      # zona nuova: non c'e' con cosa confrontarla

              n_t, v_t = len(nuovo["trains"]), len(vecchio["trains"])
              n_c = sum(1 for c in nuovo["crossings"] if c.get("covered"))
              v_c = sum(1 for c in vecchio["crossings"] if c.get("covered"))
              motivo = None
              if v_t and n_t < v_t * 0.5:
                  motivo = f"treni da {v_t} a {n_t}"
              elif v_c and n_c < v_c * 0.5:
                  motivo = f"PL con previsione da {v_c} a {n_c}"
              if motivo:
                  respinte.append(f"{fn}: {motivo}")
                  subprocess.run(["git", "checkout", "HEAD", "--", percorso], check=True)

          for fn in rotte:
              print(f"illeggibile, ripristinato: {fn}")
              subprocess.run(["git", "checkout", "HEAD", "--", f"data/aree/{fn}"])
          for r in respinte:
              print(f"peggiorata, ripristinata: {r}")
          print(f"\n{len(respinte)} zone respinte, {len(rotte)} illeggibili")
          PY

      - name: Rigenera indice e README
        run: |
          python3 -c "import sys;sys.path.insert(0,'tools');import build_area;build_area.update_index()"
          python3 tools/update_readme.py

      - name: Controlla che l'insieme sia sensato
        run: |
          python3 - <<'PY'
          import json, sys
          index = json.load(open("data/aree.json"))
          if len(index["areas"]) < 50:
              sys.exit(f"solo {len(index['areas'])} zone nell'indice: qualcosa e' andato storto")
          for meta in index["areas"]:
              d = json.load(open(f"data/aree/{meta['slug']}.json"))
              codes = [s["code"] for s in d["stations"]]
              if len(codes) != len(set(codes)):
                  sys.exit(f"{meta['slug']}: codici stazione duplicati")
          coperti = sum(a["covered"] for a in index["areas"])
          print(f"{len(index['areas'])} zone, {coperti} passaggi a livello con previsione")
          PY

      - name: Committa se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ README.md; then
            echo "nessuna variazione"
            exit 0
          fi
          git add data/ README.md
          git commit -m "Aggiorna i dati delle zone ($(date -u +%Y-%m-%d))"
          git push

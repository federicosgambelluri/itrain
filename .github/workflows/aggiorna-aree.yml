name: Aggiorna le zone

# I dati di ogni zona -- passaggi a livello, stazioni, tratte e orario dei
# treni -- si rigenerano ogni notte.
#
# L'orario notturno non e' una comodita' ma un vincolo. andamentoTreno, che e'
# cio' che restituisce tutte le fermate di un treno in una chiamata sola,
# risponde solo per i treni con data di partenza odierna: eseguito a giornata
# gia' iniziata perderebbe tutti i treni gia' passati. E' anche cio' che rende
# il costo indipendente dal numero di stazioni.

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC, cioe' le 3:30 in Italia d'estate
  workflow_dispatch:
    inputs:
      zona:
        description: "Una zona o piu' (slug separati da spazio), vuoto per tutte"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: aggiorna-zone
  cancel-in-progress: false

jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # I binari cambiano molto piu' lentamente degli orari: riscaricarli ogni
      # notte per dieci zone significherebbe venti interrogazioni pesanti a
      # Overpass, che limita le richieste ravvicinate e finirebbe per
      # respingerle. La chiave contiene l'anno e il mese, quindi la copia si
      # rinnova da sola una volta al mese.
      - name: Recupera la copia locale di binari e nodi
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: osm-${{ hashFiles('tools/aree.json') }}-${{ github.run_id }}
          restore-keys: |
            osm-${{ hashFiles('tools/aree.json') }}-

      - name: Rigenera le zone
        run: |
          zone="${{ github.event.inputs.zona }}"
          if [ -z "$zone" ]; then
            zone=$(python3 -c "import json;print(' '.join(a['slug'] for a in json.load(open('tools/aree.json'))))")
          fi
          for z in $zone; do
            echo "::group::$z"
            # Una zona che fallisce non deve impedire alle altre di aggiornarsi.
            python3 tools/build_area.py "$z" --cache-ways \
              || echo "zona $z non riuscita, proseguo"
            sleep 30    # respiro fra una zona e l'altra, per non farsi respingere
            echo "::endgroup::"
          done

      - name: Controlla che i file siano sensati
        run: |
          python3 - <<'PY'
          import json, os, sys
          index = json.load(open("data/aree.json"))
          if not index["areas"]:
              sys.exit("nessuna zona nell'indice")
          for meta in index["areas"]:
              d = json.load(open(f"data/aree/{meta['slug']}.json"))
              n_t, n_x, n_s = len(d["trains"]), len(d["crossings"]), len(d["segments"])
              print(f"{meta['slug']}: {n_t} treni, {n_x} PL "
                    f"({meta['covered']} con previsione), {n_s} tratte")
              # Un file svuotato o troncato e' peggio di uno vecchio: meglio
              # non committare affatto e lasciare in piedi quello precedente.
              if n_t < 20:
                  sys.exit(f"{meta['slug']}: solo {n_t} treni, scansione incompleta")
              if n_x < 5:
                  sys.exit(f"{meta['slug']}: solo {n_x} passaggi a livello")
              if meta["covered"] < 1:
                  sys.exit(f"{meta['slug']}: nessun PL con previsione")
              codes = [s["code"] for s in d["stations"]]
              if len(codes) != len(set(codes)):
                  sys.exit(f"{meta['slug']}: codici stazione duplicati")
              media = sum(len(t["stops"]) for t in d["trains"]) / n_t
              if media < 2.5:
                  sys.exit(f"{meta['slug']}: {media:.1f} fermate medie, dati mutili")
          PY

      - name: Committa se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ tools/cache; then
            echo "nessuna variazione"
            exit 0
          fi
          git add data/ tools/cache
          git commit -m "Aggiorna i dati delle zone ($(date -u +%Y-%m-%d))"
          git push

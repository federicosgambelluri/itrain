name: Aggiorna i dati

# L'orario dei treni cambia, e il file statico e' la rete di sicurezza usata
# quando i proxy pubblici non rispondono: se invecchia, l'app resta senza
# nulla su cui ripiegare. Si aggiorna quindi ogni notte da solo.
#
# L'orario notturno non e' una comodita' ma un vincolo: andamentoTreno, che e'
# cio' che da' tutte le fermate di un treno in una chiamata sola, risponde solo
# per i treni con data di partenza odierna. Eseguito a giornata gia' iniziata
# perderebbe tutti i treni gia' passati.
#
# Ogni esecuzione scansiona la giornata e fonde i treni trovati con quelli gia'
# noti, annotando in quali giorni della settimana circolano: nel giro di una
# settimana la distinzione feriale/festivo si completa da sola.

on:
  schedule:
    - cron: "30 1 * * *"     # 01:30 UTC, cioe' le 3:30 in Italia d'estate
  workflow_dispatch:          # avviabile a mano dalla scheda Actions
    inputs:
      reset:
        description: "Ricostruire l'orario da zero invece di fonderlo"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: aggiorna-dati       # niente esecuzioni sovrapposte: il file si fonde
  cancel-in-progress: false

jobs:
  orario:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scansiona l'orario di oggi
        run: |
          extra=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then extra="--reset"; fi
          python3 tools/build_timetable.py --day-offset 0 $extra

      - name: Controlla che il file sia sensato
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data/timetable.json"))
          n = len(d["trains"])
          print(f"{n} treni nell'orario")
          # Un file troncato o svuotato e' peggio di uno vecchio: meglio non
          # committarlo affatto e lasciare in piedi quello precedente.
          if n < 10:
              sys.exit(f"solo {n} treni: sospetto, non committo")
          for t in d["trains"]:
              if len(t["stops"]) < 2:
                  sys.exit(f"treno {t['n']} con meno di due fermate")
          # Con la tratta intera un treno tocca molte stazioni: se la media
          # crolla vuol dire che andamentoTreno ha risposto a meta', e un
          # orario mutilato e' peggio di uno vecchio.
          media = sum(len(t["stops"]) for t in d["trains"]) / n
          print(f"fermate medie per treno: {media:.1f}")
          if media < 4:
              sys.exit(f"solo {media:.1f} fermate medie: scansione incompleta")
          PY

      - name: Committa se qualcosa e' cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/timetable.json; then
            echo "nessuna variazione"
            exit 0
          fi
          git add data/timetable.json
          git commit -m "Aggiorna l'orario dei treni ($(date -u +%Y-%m-%d))"
          git push
